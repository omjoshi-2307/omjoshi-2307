<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc">
<title id="title">Om Arun Joshi — Pixel Developer Studio</title>
<desc id="desc">A bright pixel-inspired developer workspace with two monitors, a custom avatar, notebook, plant and sunny window.</desc>
<defs>
  <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4f8f7"/><stop offset="1" stop-color="#dceae8"/></linearGradient>
  <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#172a3a"/><stop offset="1" stop-color="#243f50"/></linearGradient>
  <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#c68f65"/><stop offset="1" stop-color="#a96f4c"/></linearGradient>
  <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0H0V18" fill="none" stroke="#9cbab5" stroke-opacity=".16"/></pattern>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#29434a" flood-opacity=".16"/></filter>
</defs>
<rect width="1200" height="450" rx="22" fill="url(#wall)"/><rect width="1200" height="450" rx="22" fill="url(#grid)"/><rect x="24" y="24" width="1152" height="402" rx="14" fill="none" stroke="#a7c4be" stroke-width="2"/>
<!-- window -->
<rect x="64" y="66" width="260" height="190" rx="7" fill="#b7dcd8" stroke="#668e89" stroke-width="7"/><rect x="77" y="79" width="234" height="164" fill="#dff3ee"/><path d="M194 79V243M77 160H311" stroke="#8fb9b1" stroke-width="6"/>
<circle cx="263" cy="117" r="25" fill="#f5c96a"><animate attributeName="opacity" values=".8;1;.8" dur="4s" repeatCount="indefinite"/></circle>
<path d="M90 218l35-35 27 27 24-18 43 51H90Z" fill="#8ab9a1"/><path d="M191 243l42-48 25 25 20-17 33 40Z" fill="#6d9d86"/>
<!-- wall notes -->
<g font-family="Verdana,Arial,sans-serif"><rect x="388" y="63" width="180" height="76" rx="5" fill="#fffdf5" stroke="#d5c9a8" stroke-width="2" transform="rotate(-2 388 63)"/><text x="407" y="91" font-size="12" fill="#59716d" font-weight="bold">THINK</text><text x="407" y="112" font-size="15" fill="#243f50" font-weight="bold">BUILD</text><text x="407" y="129" font-size="11" fill="#59716d">REPEAT ↗</text><rect x="588" y="64" width="135" height="55" rx="5" fill="#e7f1d8" stroke="#a9c39b" stroke-width="2" transform="rotate(2 588 64)"/><text x="606" y="96" font-size="13" fill="#45634f" font-weight="bold">STAY CURIOUS</text></g>
<!-- identity -->
<g font-family="Verdana,Arial,sans-serif"><text x="770" y="91" font-size="13" letter-spacing="3" fill="#54746f" font-weight="bold">PERSONAL DEVELOPER STUDIO</text><text x="768" y="133" font-size="35" letter-spacing="1" fill="#183344" font-weight="bold">OM ARUN JOSHI</text><text x="771" y="161" font-size="16" fill="#347f78">Driven by questions, guided by reason.</text><rect x="771" y="179" width="205" height="3" rx="1.5" fill="#65b7a8"/><text x="771" y="204" font-size="12" letter-spacing="2" fill="#607d78">CODE · EXPLORE · EXPERIMENT</text></g>
<!-- desk -->
<path d="M55 310H1145V337H55Z" fill="url(#desk)" filter="url(#shadow)"/><path d="M92 337H1108L1087 410H113Z" fill="#a96f4c"/>
<!-- left code monitor -->
<g filter="url(#shadow)"><rect x="386" y="174" width="282" height="159" rx="9" fill="#29404a"/><rect x="397" y="185" width="260" height="137" rx="4" fill="url(#screen)"/><rect x="397" y="185" width="260" height="18" rx="4" fill="#314d5b"/><circle cx="410" cy="194" r="3" fill="#f08c79"/><circle cx="422" cy="194" r="3" fill="#ebc66e"/><circle cx="434" cy="194" r="3" fill="#79c6a8"/><g font-family="monospace" font-size="10"><text x="412" y="222" fill="#83cfc0">~/projects/om.dev</text><text x="412" y="244" fill="#a8bbd0">const</text><text x="445" y="244" fill="#f1c879"> curiosity</text><text x="507" y="244" fill="#a8bbd0"> =</text><text x="523" y="244" fill="#9bd6a8"> "always";</text><text x="412" y="261" fill="#b6a5e8">function</text><text x="464" y="261" fill="#8fc8e8"> build</text><text x="500" y="261" fill="#a8bbd0">() {</text><text x="426" y="278" fill="#9bd6a8"> exploreIdeas();</text><text x="426" y="295" fill="#9bd6a8"> createSolutions();</text><text x="412" y="311" fill="#a8bbd0">}</text></g><rect x="524" y="333" width="8" height="17" fill="#526c75"/><rect x="490" y="349" width="76" height="7" rx="3" fill="#526c75"/></g>
<!-- right AI monitor -->
<g filter="url(#shadow)"><rect x="696" y="191" width="224" height="142" rx="9" fill="#29404a"/><rect x="706" y="201" width="204" height="121" rx="4" fill="#182e3c"/><rect x="706" y="201" width="204" height="18" rx="4" fill="#314d5b"/><circle cx="719" cy="210" r="3" fill="#f08c79"/><circle cx="731" cy="210" r="3" fill="#ebc66e"/><circle cx="743" cy="210" r="3" fill="#79c6a8"/><text x="720" y="241" font-family="monospace" font-size="10" fill="#83cfc0">SYSTEM / EXPLORATION</text><g stroke="#65b7a8" stroke-width="2" fill="none"><path d="M750 270L790 250L830 272L868 246"><animate attributeName="stroke-dasharray" values="0 260;130 130;260 0" dur="3.5s" repeatCount="indefinite"/></path><path d="M790 250L802 295L850 293"><animate attributeName="opacity" values=".3;1;.3" dur="2.4s" repeatCount="indefinite"/></path></g><g fill="#f2c66d"><rect x="745" y="265" width="10" height="10"><animate attributeName="opacity" values=".3;1;.3" dur="1.6s" repeatCount="indefinite"/></rect><rect x="785" y="245" width="10" height="10"><animate attributeName="opacity" values="1;.3;1" dur="1.9s" repeatCount="indefinite"/></rect><rect x="825" y="267" width="10" height="10"><animate attributeName="opacity" values=".4;1;.4" dur="2.1s" repeatCount="indefinite"/></rect><rect x="863" y="241" width="10" height="10"><animate attributeName="opacity" values="1;.3;1" dur="1.7s" repeatCount="indefinite"/></rect><rect x="797" y="290" width="10" height="10"/><rect x="845" y="288" width="10" height="10"/></g><rect x="804" y="333" width="8" height="17" fill="#526c75"/><rect x="774" y="349" width="68" height="7" rx="3" fill="#526c75"/></g>
<!-- avatar in chair -->
<g filter="url(#shadow)"><rect x="586" y="264" width="76" height="82" rx="9" fill="#547f83"/><rect x="578" y="333" width="92" height="10" rx="4" fill="#355c63"/><rect x="599" y="230" width="48" height="12" fill="#263746"/><rect x="590" y="242" width="66" height="35" fill="#263746"/><rect x="598" y="276" width="50" height="12" fill="#263746"/><rect x="600" y="247" width="46" height="31" fill="#d99a72"/><rect x="592" y="251" width="8" height="20" fill="#d99a72"/><rect x="646" y="251" width="8" height="20" fill="#d99a72"/><rect x="584" y="287" width="78" height="47" fill="#65afa3"/><rect x="573" y="298" width="13" height="31" fill="#65afa3"/><rect x="660" y="298" width="13" height="31" fill="#65afa3"/><rect x="611" y="292" width="24" height="8" fill="#e5f2ea"/></g>
<!-- keyboard and mouse -->
<rect x="456" y="365" width="184" height="20" rx="4" fill="#314a54"/><path d="M466 371H630M466 377H630" stroke="#8abdb2" stroke-width="2" stroke-dasharray="5 5"/><rect x="656" y="364" width="29" height="22" rx="9" fill="#dce9e5" stroke="#698c84" stroke-width="2"/>
<!-- notebook -->
<g transform="rotate(-5 330 369)"><rect x="250" y="350" width="116" height="57" rx="4" fill="#fffdf5" stroke="#c8bda6" stroke-width="2"/><path d="M263 363H352M263 374H344M263 385H332" stroke="#a7b8b1" stroke-width="2"/><text x="263" y="399" font-family="monospace" font-size="8" fill="#56847a">IDEAS → BUILD</text></g>
<!-- plant -->
<rect x="1000" y="277" width="48" height="47" rx="5" fill="#d58d68"/><path d="M1024 278V231M1024 258Q991 250 994 226Q1018 225 1024 258M1024 248Q1054 239 1052 215Q1030 218 1024 248" fill="#6fad82" stroke="#4d8c70" stroke-width="3"/>
<!-- floating pixels -->
<g fill="#65b7a8"><rect x="72" y="285" width="9" height="9"><animateTransform attributeName="transform" type="translate" values="0 0;0 -13;0 0" dur="3.2s" repeatCount="indefinite"/></rect><rect x="90" y="267" width="6" height="6"><animateTransform attributeName="transform" type="translate" values="0 0;0 -9;0 0" dur="2.7s" repeatCount="indefinite"/></rect><rect x="1115" y="246" width="8" height="8"><animateTransform attributeName="transform" type="translate" values="0 0;0 -11;0 0" dur="3.6s" repeatCount="indefinite"/></rect></g>
<rect x="24" y="412" width="1152" height="14" rx="4" fill="#d1e4df"/><rect x="24" y="412" width="290" height="14" rx="4" fill="#65b7a8"/><text x="44" y="405" font-family="Verdana,Arial,sans-serif" font-size="10" letter-spacing="2" fill="#54746f">A SPACE TO THINK, BUILD &amp; EXPLORE</text><text x="1150" y="405" text-anchor="end" font-family="Verdana,Arial,sans-serif" font-size="10" letter-spacing="2" fill="#54746f">OM.DEV</text>
</svg>