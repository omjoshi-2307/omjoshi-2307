<text x="54" y="54" fill="#35C5D8" font-family="IBM Plex Mono,monospace" font-size="11" letter-spacing="2.5">FIELD NOTES / 02 — THE WORKING LOOP</text>
<text x="54" y="88" fill="#DCE7E8" font-family="Space Grotesk,Inter,sans-serif" font-size="27" font-weight="700">Progress is a practice, not a status badge.</text>
<g transform="translate(56 119)" font-family="IBM Plex Mono,monospace">
