<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="t d">
<title id="t">The working loop — idea, experiment, build, refine, share</title><desc id="d">A personal development principle showing a repeatable learning and engineering loop, not a live contribution metric.</desc>
