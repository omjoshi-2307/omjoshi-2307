<g transform="translate(270)"><circle cx="0" cy="18" r="6" fill="#101820" stroke="#35C5D8" stroke-width="2"/><text x="0" y="0" fill="#35C5D8" font-size="10">02</text><text x="0" y="48" fill="#DCE7E8" font-size="13">EXPERIMENT</text><text x="0" y="66" fill="#657783" font-size="9">TEST AN APPROACH</text></g>
<g transform="translate(540)"><circle cx="0" cy="18" r="6" fill="#101820" stroke="#35C5D8" stroke-width="2"/><text x="0" y="0" fill="#35C5D8" font-size="10">03</text><text x="0" y="48" fill="#DCE7E8" font-size="13">BUILD</text><text x="0" y="66" fill="#657783" font-size="9">MAKE IT WORK</text></g>
<g transform="translate(810)"><circle cx="0" cy="18" r="6" fill="#101820" stroke="#E9A64B" stroke-width="2"/><text x="0" y="0" fill="#E9A64B" font-size="10">04</text><text x="0" y="48" fill="#DCE7E8" font-size="13">REFINE</text><text x="0" y="66" fill="#657783" font-size="9">LEARN &amp; IMPROVE</text></g>
<g transform="translate(1080)"><circle cx="0" cy="18" r="6" fill="#101820" stroke="#E9A64B" stroke-width="2"/><text x="0" y="0" fill="#E9A64B" font-size="10">05</text><text x="0" y="48" fill="#DCE7E8" font-size="13">SHARE</text><text x="0" y="66" fill="#657783" font-size="9">CONTRIBUTE</text></g>
