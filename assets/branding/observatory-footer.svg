<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="160" viewBox="0 0 1200 160" role="img" aria-labelledby="title desc">
  <title id="title">The Digital Observatory — closing mark</title>
  <desc id="desc">A restrained closing banner with the observatory mark and the words Build, Explore, Experiment.</desc>
  <defs>
    <pattern id="footergrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#DCE7E8" stroke-opacity=".045"/>
    </pattern>
  </defs>
  <rect width="1200" height="160" fill="#101820"/>
  <rect width="1200" height="160" fill="url(#footergrid)"/>
  <path d="M32 24H1168M32 136H1168" stroke="#657783" stroke-opacity=".55"/>
  <g transform="translate(68 46)">
    <circle cx="34" cy="34" r="30" fill="none" stroke="#35C5D8" stroke-width="3"/>
    <circle cx="34" cy="34" r="17" fill="none" stroke="#E9A64B" stroke-width="2"/>
    <path d="M34 9V59M9 34H59" stroke="#DCE7E8" stroke-opacity=".8"/>
    <circle cx="34" cy="34" r="4" fill="#E9A64B"/>
  </g>
  <text x="160" y="83" fill="#DCE7E8" font-family="Space Grotesk, Inter, sans-serif" font-size="25" font-weight="700" letter-spacing="1.4">THE DIGITAL OBSERVATORY</text>
  <text x="162" y="108" fill="#657783" font-family="IBM Plex Mono, monospace" font-size="11" letter-spacing="2">BUILD.  EXPLORE.  EXPERIMENT.</text>
  <text x="1138" y="82" text-anchor="end" fill="#35C5D8" font-family="IBM Plex Mono, monospace" font-size="12" letter-spacing="1.8">ENGINEERING THE UNKNOWN.</text>
  <text x="1138" y="107" text-anchor="end" fill="#657783" font-family="IBM Plex Mono, monospace" font-size="10" letter-spacing="1.2">OM JOSHI  /  PUNE, INDIA</text>
</svg>