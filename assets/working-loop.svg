<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-labelledby="t d">
<title id="t">The working loop</title><desc id="d">A five-stage process: question, explore, build, refine, and share.</desc>
<defs><linearGradient id="l" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#35C5D8"/><stop offset="1" stop-color="#E9A64B"/></linearGradient></defs>
<rect width="1200" height="210" fill="#0B1218"/><path d="M26 22H1174V188H26Z" fill="none" stroke="#657783" stroke-opacity=".65"/>
<text x="52" y="55" fill="#35C5D8" font-family="monospace" font-size="11" letter-spacing="2.5">METHOD / 03 — THE WORKING LOOP</text>
<text x="52" y="88" fill="#DCE7E8" font-family="Arial,sans-serif" font-size="25" font-weight="700">Progress comes from a repeatable process.</text>
<path d="M110 132H1090" stroke="url(#l)" stroke-width="3"/>
<g font-family="monospace" text-anchor="middle">
  <g transform="translate(110 132)"><circle r="17" fill="#101820" stroke="#35C5D8" stroke-width="3"/><text y="5" fill="#DCE7E8" font-size="12">01</text><text y="43" fill="#35C5D8" font-size="12">QUESTION</text></g>
  <g transform="translate(355 132)"><circle r="17" fill="#101820" stroke="#35C5D8" stroke-width="3"/><text y="5" fill="#DCE7E8" font-size="12">02</text><text y="43" fill="#DCE7E8" font-size="12">EXPLORE</text></g>
  <g transform="translate(600 132)"><circle r="17" fill="#101820" stroke="#E9A64B" stroke-width="3"/><text y="5" fill="#DCE7E8" font-size="12">03</text><text y="43" fill="#E9A64B" font-size="12">BUILD</text></g>
  <g transform="translate(845 132)"><circle r="17" fill="#101820" stroke="#35C5D8" stroke-width="3"/><text y="5" fill="#DCE7E8" font-size="12">04</text><text y="43" fill="#DCE7E8" font-size="12">REFINE</text></g>
  <g transform="translate(1090 132)"><circle r="17" fill="#101820" stroke="#E9A64B" stroke-width="3"/><text y="5" fill="#DCE7E8" font-size="12">05</text><text y="43" fill="#E9A64B" font-size="12">SHARE</text></g>
</g>
</svg>