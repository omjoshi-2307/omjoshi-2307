name: Generate contribution graph

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/visuals/github-contribution-snake.svg
            assets/visuals/github-contribution-snake-dark.svg?palette=github-dark

      - name: Commit contribution graph
        uses: EndBug/add-and-commit@v9
        with:
          message: "chore: update GitHub contribution graph"
          add: "assets/visuals/github-contribution-snake.svg assets/visuals/github-contribution-snake-dark.svg"
