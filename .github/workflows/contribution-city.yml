name: Generate Contribution City

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: contribution-city
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Generate midnight skyline
        uses: partialHuman/contribution-city@dfa6a41f7adec37fd83171fbe15aa1d83fd4e5bb
        with:
          username: ${{ github.repository_owner }}
          token: ${{ secrets.GITHUB_TOKEN }}
          theme: neon-harbor
          layout: calendar
          height-preset: tall
          height-mode: sqrt
          building-style: detailed
          view-angle: high
          width: 2000
          height: 1000
          background: transparent
          output: dist/city-dark.svg

      - name: Generate light city fallback
        uses: partialHuman/contribution-city@dfa6a41f7adec37fd83171fbe15aa1d83fd4e5bb
        with:
          username: ${{ github.repository_owner }}
          token: ${{ secrets.GITHUB_TOKEN }}
          theme: profile-light
          layout: calendar
          height-preset: tall
          height-mode: sqrt
          building-style: detailed
          view-angle: high
          width: 2000
          height: 1000
          background: transparent
          output: dist/city-light.svg

      - name: Normalize generated SVG bounds
        run: |
          set -euo pipefail
          for file in dist/city-dark.svg dist/city-light.svg; do
            sed -i '0,/<svg /s//<svg preserveAspectRatio="xMidYMid meet" overflow="hidden" /' "$file"
          done

      - name: Fetch and enlarge activity card typography
        run: |
          set -euo pipefail
          mkdir -p dist
          curl -fsSL --retry 3 --retry-delay 2 "https://github-readme-stats.vercel.app/api?username=${GITHUB_REPOSITORY_OWNER}&show_icons=true&hide_border=true&bg_color=f7f2e8&title_color=2456d8&icon_color=e65b35&text_color=172b3c" -o dist/profile-stats.svg
          curl -fsSL --retry 3 --retry-delay 2 "https://github-readme-stats.vercel.app/api/top-langs/?username=${GITHUB_REPOSITORY_OWNER}&layout=compact&hide_border=true&bg_color=f7f2e8&title_color=2456d8&text_color=172b3c" -o dist/top-languages.svg
          curl -fsSL --retry 3 --retry-delay 2 "https://github-readme-streak-stats.herokuapp.com/?user=${GITHUB_REPOSITORY_OWNER}&hide_border=true&background=f7f2e8&ring=2456d8&fire=e65b35&currStreakLabel=2456d8&sideLabels=172b3c&dates=657781" -o dist/contribution-streak.svg

          python3 - <<'PY'
          from pathlib import Path
          import re
          
          files = [
              Path("dist/profile-stats.svg"),
              Path("dist/top-languages.svg"),
              Path("dist/contribution-streak.svg"),
          ]
          factor = 1.22
          
          for path in files:
              svg = path.read_text(encoding="utf-8")
              if "<svg" not in svg or "</svg>" not in svg:
                  raise SystemExit(f"Invalid SVG response: {path}")
              
              def scale(match):
                  value = float(match.group(2))
                  return match.group(1) + f"{value * factor:.2f}" + match.group(3)
              
              # Scale CSS declarations and presentation attributes without changing layout geometry.
              svg = re.sub(
                  r"(font-size\\s*:\\s*)([0-9]+(?:\\.[0-9]+)?)(px|pt|em|rem)",
                  scale,
                  svg,
                  flags=re.IGNORECASE,
              )
              svg = re.sub(
                  r'(font-size=")([0-9]+(?:\\.[0-9]+)?)(")',
                  scale,
                  svg,
                  flags=re.IGNORECASE,
              )
              path.write_text(svg, encoding="utf-8")
              print(f"Enlarged typography by {int((factor - 1) * 100)}%: {path}")
          PY

      - name: Publish to the output branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin output > /dev/null 2>&1; then
            git fetch --depth=1 origin output
            git worktree add ../output-branch origin/output
            git -C ../output-branch checkout -B output
          else
            git worktree add --detach ../output-branch
            git -C ../output-branch checkout --orphan output
            git -C ../output-branch rm -rf --quiet . || true
          fi

          cp dist/city-dark.svg dist/city-light.svg dist/profile-stats.svg dist/top-languages.svg dist/contribution-streak.svg ../output-branch/
          cd ../output-branch
          git add city-dark.svg city-light.svg profile-stats.svg top-languages.svg contribution-streak.svg
          git rm -f --ignore-unmatch github-contribution-grid-snake.svg github-contribution-grid-snake-dark.svg

          if git diff --staged --quiet; then
            echo "City unchanged, nothing to publish."
            exit 0
          fi

          if git rev-parse --verify --quiet HEAD > /dev/null; then
            git commit --amend --quiet -m "chore: update contribution city [skip ci]"
          else
            git commit --quiet -m "chore: update contribution city [skip ci]"
          fi
          git push --force origin HEAD:output
